apiVersion: v1
kind: Service
metadata:
  name: toolsense-api
  namespace: default
  labels:
    app: toolsense
    component: api
spec:
  type: NodePort          # use LoadBalancer on cloud; NodePort for minikube
  selector:
    app: toolsense
    component: api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30080     # access via minikube ip:30080
---
# Headless service for internal DNS
apiVersion: v1
kind: Service
metadata:
  name: toolsense-api-internal
  namespace: default
spec:
  clusterIP: None
  selector:
    app: toolsense
    component: api
  ports:
    - port: 8000
      targetPort: 8000
